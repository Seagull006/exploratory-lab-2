
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BC Earthquakes 2025-2026</title>

  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <style>
    body { margin: 0; }

    #map {
      width: 100%;
      height: 100vh;
    }
    #controls {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background: white;
  padding: 15px;
  border-radius: 5px;
  box-shadow: 0 1px 5px #999;
  font-family: Arial, sans-serif;
  font-size: 14px;
  width: 230px;
}

#magSlider {
  width: 100%;
}

  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    // Basemap: OpenFreeMap
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-126, 54],
      zoom: 4
    });

    // Adapted from MapLibre's Draw GeoJSON Points example.
    map.on('load', () => {

      map.addSource('earthquakes', {
        type: 'geojson',
        data: 'earthquakes_bc.geojson'
      });

      map.addLayer({
        id: 'earthquake-points',
        type: 'circle',
        source: 'earthquakes',
        paint: {
          'circle-color': '#d66b36',
          'circle-radius': [
            'interpolate', ['linear'], ['get', 'mag'],
            3, 3,
            6, 12,
            8, 18
          ],
          'circle-opacity': 0.75,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 0.7
        }
      });

    });
  </script>
</body>
</html>
