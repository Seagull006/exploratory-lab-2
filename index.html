<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BC Earthquakes 2025-2026</title>

  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.js"></script>

  <style>
    body { margin: 0; }

    #map {
      width: 100%;
      height: 100vh;
    }
    #controls {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background: white;
  padding: 15px;
  border-radius: 5px;
  box-shadow: 0 1px 5px #999;
  font-family: Arial, sans-serif;
  font-size: 14px;
  width: 230px;
}
    
#magRange {
  margin: 25px 10px;
}

#magSlider, #maxMagSlider {
  width: 100%;
}
  </style>
</head>

<body>
  <div id="map"></div>
  
<div id="controls">
  <b>Earthquake Magnitude Filter</b>

  <p>Magnitude range: <span id="magValue">2.5 – 6.5</span></p>

  <div id="magRange"></div>

  <p id="quakeCount">Loading earthquake count...</p>
</div>

  <script>
    // Basemap: OpenFreeMap
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-126, 54],
      zoom: 4
    });

    // Adapted from MapLibre's Draw GeoJSON Points example.
    map.on('load', () => {

      map.addSource('earthquakes', {
        type: 'geojson',
        data: 'earthquakes_bc.geojson'
      });

      map.addLayer({
        id: 'earthquake-points',
        type: 'circle',
        source: 'earthquakes',
        paint: {
          'circle-color': '#d66b36',
          'circle-radius': [
            'interpolate', ['linear'], ['get', 'mag'],
            3, 3,
            6, 12,
            8, 18
          ],
          'circle-opacity': 0.75,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 0.7
        }
      });

const rangeSlider = document.getElementById('magRange');
const magValue = document.getElementById('magValue');
const quakeCount = document.getElementById('quakeCount');

noUiSlider.create(rangeSlider, {
  start: [2.5, 6.5],
  connect: true,
  step: 0.5,
  range: {
    min: 2.5,
    max: 6.5
  }
});


fetch('earthquakes_bc.geojson')
  .then(response => response.json())
  .then(data => {

    // Only include actual earthquake events.
    const earthquakes = data.features.filter(feature =>
      feature.properties.type === 'earthquake'
    );

    // Update the map whenever either slider handle moves.
    rangeSlider.noUiSlider.on('update', values => {

      const minimum = Number(values[0]);
      const maximum = Number(values[1]);

      magValue.textContent =
        minimum.toFixed(1) + ' – ' + maximum.toFixed(1);

      // Display earthquakes within the selected magnitude range.
      map.setFilter('earthquake-points', [
        'all',
        ['==', ['get', 'type'], 'earthquake'],
        ['>=', ['get', 'mag'], minimum],
        ['<=', ['get', 'mag'], maximum]
      ]);

      // Count earthquakes within the selected magnitude range.
      const matching = earthquakes.filter(feature =>
        feature.properties.mag >= minimum &&
        feature.properties.mag <= maximum
      );
      quakeCount.textContent =
        matching.length + ' earthquakes in selected range';
    });
  });
});
  </script>
