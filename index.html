
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BC Earthquakes 2025-2026</title>

  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <style>
    body { margin: 0; }

    #map {
      width: 100%;
      height: 100vh;
    }
    #controls {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background: white;
  padding: 15px;
  border-radius: 5px;
  box-shadow: 0 1px 5px #999;
  font-family: Arial, sans-serif;
  font-size: 14px;
  width: 230px;
}

#magSlider, #maxMagSlider {
  width: 100%;
}
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="controls">
  <b>Earthquake Magnitude Filter</b>
  <p>Minimum magnitude: <span id="magValue">2.5</span></p>
  <input type="range" id="magSlider"
         min="2.5" max="6.5" step="0.5" value="2.5">
  <p>Maximum magnitude: <span id="maxMagValue">9.0</span></p>
  <input type="range" id="maxMagSlider"
         min="2.5" max="6.5" step="0.5" value="6.5">


  <p id="quakeCount">Loading earthquake count...</p>
</div>

  <script>
    // Basemap: OpenFreeMap
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-126, 54],
      zoom: 4
    });

    // Adapted from MapLibre's Draw GeoJSON Points example.
    map.on('load', () => {

      map.addSource('earthquakes', {
        type: 'geojson',
        data: 'earthquakes_bc.geojson'
      });

      map.addLayer({
        id: 'earthquake-points',
        type: 'circle',
        source: 'earthquakes',
        paint: {
          'circle-color': '#d66b36',
          'circle-radius': [
            'interpolate', ['linear'], ['get', 'mag'],
            3, 3,
            6, 12,
            8, 18
          ],
          'circle-opacity': 0.75,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 0.7
        }
      });

const slider = document.getElementById('magSlider');
const maxSlider = document.getElementById('maxMagSlider');
const magValue = document.getElementById('magValue');
const maxMagValue = document.getElementById('maxMagValue');
const quakeCount = document.getElementById('quakeCount');

// Read the earthquake data.
fetch('earthquakes_bc.geojson')
  .then(response => response.json())
  .then(data => {

     // Exclude non-earthquake events.
    const earthquakes = data.features.filter(feature =>
      feature.properties.type === 'earthquake'
    );

    function updateMagnitude(changed) {

      // Keep min from passing max slider.
      if (Number(slider.value) > Number(maxSlider.value)) {
        if (changed === 'min') {
          maxSlider.value = slider.value;
        } else {
          slider.value = maxSlider.value;
        }
      }
      const minimum = Number(slider.value);
      const maximum = Number(maxSlider.value);

      magValue.textContent = minimum.toFixed(1);
      maxMagValue.textContent = maximum.toFixed(1);

      // Filter the points displayed on the map.
      map.setFilter('earthquake-points', [
        'all',
        ['==', ['get', 'type'], 'earthquake'],
        ['>=', ['get', 'mag'], minimum],
        ['<=', ['get', 'mag'], maximum]
      ]);
      
      // Count earthquakes that meet the same filter.
      const matching = earthquakes.filter(feature =>
        feature.properties.mag >= minimum &&
        feature.properties.mag <= maximum
      );
      
      quakeCount.textContent =
        matching.length + ' earthquakes in dataset';
      
    }

    // Update the map whenever the slider moves.
    slider.addEventListener('input', updateMagnitude);
    maxSlider.addEventListener('input', () => updateMagnitude('max'));
    updateMagnitude();

  });

    });
  </script>
</body>
</html>
